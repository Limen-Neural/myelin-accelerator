# Docker image build with CUDA toolkit 13.3.1 (compile-only on GH-hosted).

name: Docker CUDA 13.3.1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: docker build (cuda 13.3.1 devel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: myelin-accelerator:cuda13.3.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
