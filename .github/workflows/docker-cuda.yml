#
# Docker image build with CUDA toolkit 13.3.1 (compile-only on GH-hosted).

name: Docker CUDA 13.3.1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: docker build (cuda 13.3.1 devel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: myelin-accelerator:cuda13.3.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
