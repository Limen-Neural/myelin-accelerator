#
# Qodana static analysis:
#   - Rust (primary): host API, packing, stubs
#   - C++ (secondary): cu/*.cu via generated compile_commands.json
#
# Uses JetBrains/qodana-action SHA-pinned to v2026.2.0 with short linter
# names (qodana-rust / qodana-cpp). Bump the action pin deliberately when
# upgrading Qodana; do not float unpinned action tags.
#
# Requires repository secret QODANA_TOKEN for full cloud reporting.
# Without the token, the job reports a notice and exits successfully so
# forks / local clones are not blocked.

name: Qodana

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana-rust:
    name: Qodana Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Scan the PR head (qodana.yaml is introduced on this branch; main
          # does not have it, so merge-base PR mode fails looking for the file).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Skip if no QODANA_TOKEN
        id: token
        run: |
          if [ -z "${{ secrets.QODANA_TOKEN }}" ]; then
            echo "::notice::QODANA_TOKEN not set — skipping Qodana Rust upload (add secret to enable)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Qodana Scan (Rust)
        if: steps.token.outputs.skip != 'true'
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692  # v2026.2.0
        with:
          args: --config qodana.yaml
          # TODO(post-merge): restore pr-mode: true once qodana.yaml exists on
          # main (PR-mode loads config against the base commit and currently
          # fails when base lacks these files).
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  qodana-cpp:
    name: Qodana C++ (cu/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Skip if no QODANA_TOKEN
        id: token
        run: |
          if [ -z "${{ secrets.QODANA_TOKEN }}" ]; then
            echo "::notice::QODANA_TOKEN not set — skipping Qodana C++ upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate compile_commands.json for cu/
        if: steps.token.outputs.skip != 'true'
        run: bash scripts/gen_compile_commands_cuda.sh

      - name: Qodana Scan (C++)
        if: steps.token.outputs.skip != 'true'
        # Secondary scan: cloud runners lack CUDA toolkit; qodana-cpp 2026.2
        # can fail project configure on pure device TUs. Do not block the PR.
        continue-on-error: true
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692  # v2026.2.0
        with:
          args: --config qodana-cpp.yaml
          # TODO(post-merge): restore pr-mode: true once qodana-cpp.yaml is on main.
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          XDG_RUNTIME_DIR: /tmp/xdg-runtime-qodana
