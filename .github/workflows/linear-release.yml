name: Report published crate to Linear

on:
  release:
    types: [released]

permissions:
  contents: read
  actions: read

concurrency:
  group: linear-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  report:
    # The released activity covers stable publication and prerelease promotion.
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published tag and complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version and shipped commit
        id: crate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be v<major>.<minor>.<patch>"
            exit 1
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag and Cargo.toml version differ"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$sha" ]]; then
            echo "::error::Checkout is not the release tag commit"
            exit 1
          fi
          # A tag is a scan base only after its stable GitHub release is
          # published. Unpublished candidate and prerelease tags are ignored.
          published_tags="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and .published_at != null) | .tag_name')"
          previous=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$RELEASE_TAG" || ! "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if git merge-base --is-ancestor "refs/tags/$candidate^{commit}" HEAD 2>/dev/null; then
              candidate_sha="$(git rev-parse "refs/tags/$candidate^{commit}")"
              reported_tags="$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/workflows/linear-release.yml/runs?event=release&head_sha=$candidate_sha&status=success&per_page=100" \
                --jq '.workflow_runs[] | .head_branch')"
              if ! grep -Fxq "$candidate" <<< "$reported_tags"; then
                echo "::error::Stable release $candidate has no successful Linear report; rerun its workflow before $RELEASE_TAG"
                exit 1
              fi
              if [[ -z "$previous" ]]; then
                previous="$candidate"
              fi
            fi
          done < <(printf '%s\n' "$published_tags" | sort -Vr)
          if [[ -z "$previous" ]]; then
            # The Linear base is exclusive. A local empty commit, unrelated to
            # HEAD, makes empty..HEAD include even the repository's root commit.
            empty_tree="$(git mktree </dev/null)"
            previous="$(git -c user.name='Release CI' -c user.email='release-ci@users.noreply.github.com' commit-tree "$empty_tree" -m 'Empty release scan base')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$previous" >> "$GITHUB_OUTPUT"
          echo "Reporting $RELEASE_TAG at commit $sha (after $previous)"

      - name: Verify the published crate and its source commit
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
          SHIPPED_SHA: ${{ steps.crate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # crates.io may index a newly published crate a short time after publish.
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          curl --fail --silent --show-error --retry 8 --retry-delay 15 \
            --retry-all-errors --user-agent 'myelin-accelerator-release-ci' \
            -o "$artifact_dir/version.json" \
            "https://crates.io/api/v1/crates/myelin-accelerator/$CRATE_VERSION"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 15 \
            --retry-all-errors --user-agent 'myelin-accelerator-release-ci' \
            -o "$artifact_dir/package.crate" \
            "https://crates.io/api/v1/crates/myelin-accelerator/$CRATE_VERSION/download"
          python3 - "$artifact_dir/version.json" "$artifact_dir/package.crate" <<'PY'
          import hashlib
          import json
          import os
          import sys
          import tarfile
          from pathlib import Path

          version = os.environ["CRATE_VERSION"]
          shipped_sha = os.environ["SHIPPED_SHA"]
          metadata = json.loads(Path(sys.argv[1]).read_text())["version"]
          if metadata["num"] != version or metadata["yanked"]:
              sys.exit("Crate version is unavailable or yanked")
          artifact = Path(sys.argv[2])
          if hashlib.sha256(artifact.read_bytes()).hexdigest() != metadata["checksum"]:
              sys.exit("Crate archive checksum differs from crates.io metadata")
          with tarfile.open(artifact, "r:gz") as archive:
              vcs_path = f"myelin-accelerator-{version}/.cargo_vcs_info.json"
              try:
                  vcs_file = archive.extractfile(vcs_path)
              except KeyError:
                  sys.exit("Published crate has no Cargo VCS information")
              if vcs_file is None:
                  sys.exit("Published crate has no Cargo VCS information")
              vcs = json.load(vcs_file)["git"]
          if vcs["sha1"] != shipped_sha or vcs.get("dirty", False):
              sys.exit("Published crate does not match the clean release tag commit")
          print(f"Verified published crate {version} from commit {shipped_sha}")
          PY

      - name: Sync shipped issues and commit to scheduled release
        id: sync
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ steps.crate.outputs.version }}
          name: v${{ steps.crate.outputs.version }}
          base_ref: ${{ steps.crate.outputs.base_ref }}
          no_branch_ref_detection: true
          links: |
            crates.io=https://crates.io/crates/myelin-accelerator/${{ steps.crate.outputs.version }}
            Shipped commit=https://github.com/${{ github.repository }}/commit/${{ steps.crate.outputs.sha }}
            GitHub release=${{ github.event.release.html_url }}

      - name: Require the intended Linear release
        env:
          REPORTED_VERSION: ${{ steps.sync.outputs.release-version }}
          EXPECTED_VERSION: ${{ steps.crate.outputs.version }}
          RELEASE_ID: ${{ steps.sync.outputs.release-id }}
        run: |
          if [[ -z "$RELEASE_ID" || "$REPORTED_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Linear sync did not report the intended version"
            exit 1
          fi

      - name: Complete the scheduled production release
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.crate.outputs.version }}
