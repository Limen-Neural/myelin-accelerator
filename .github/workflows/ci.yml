name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Match ShipOfTheseus local default (CUDA 13.3.1 / sm_120).
  MYELIN_CUDA_ARCH: sm_120

jobs:
  # ── Formatting & linting ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (no CUDA)
        run: cargo clippy --locked --no-default-features -- -D warnings

  # ── CPU-only tests & builds ────────────────────────────────────────────────
  cpu-checks:
    name: CPU checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable

      - name: Cargo test
        run: cargo test --locked

      - name: Cargo build without default features
        run: cargo build --locked --no-default-features

      - name: Cargo build without default features (release)
        run: cargo build --locked --no-default-features --release

      - name: Bench example compile (CPU, no GPU)
        run: cargo build --locked --example benchmark --features bench

  # ── CUDA PTX compile on GitHub-hosted (toolkit only, no GPU runtime) ─────
  # Proves nvcc → PTX embed for sm_120 without needing a Blackwell device.
  # Image tracks local default: CUDA toolkit 13.3.1.
  cuda-ptx-cloud:
    name: "CUDA PTX compile [cloud, toolkit 13.3.1]"
    # CPU-safe gates first (AGENTS.md / CLAUDE.md).
    needs: [lint, cpu-checks]
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:03c372fd9c65fe7739279f8c65473b315dc61efaaffab03e1e65bc7be7aee61e
    env:
      CUDA_NVCC: /usr/local/cuda/bin/nvcc
      MYELIN_CUDA_ARCH: sm_120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install Rust + build deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config libssl-dev git
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          rustc --version
          "$CUDA_NVCC" --version

      - name: Build (debug, features cuda)
        shell: bash
        run: |
          source "$HOME/.cargo/env"
          cargo build --locked --features cuda

      - name: Clippy (features cuda)
        shell: bash
        run: |
          source "$HOME/.cargo/env"
          rustup component add clippy
          cargo clippy --locked --features cuda -- -D warnings

      - name: Verify PTX non-stub + ternary present
        shell: bash
        run: |
          set -euo pipefail
          ptx_dir="$(ls -td target/debug/build/myelin-accelerator-*/out 2>/dev/null | head -n1 || true)"
          if [ -z "$ptx_dir" ]; then
            echo "::error::Could not find PTX output directory"
            exit 1
          fi
          for f in spiking_network_sm_120.ptx vector_similarity_sm_120.ptx \
                   satsolver_sm_120.ptx ternary_gemm_sm_120.ptx; do
            if [ ! -f "$ptx_dir/$f" ]; then
              echo "::error::Missing PTX file: $f"
              exit 1
            fi
            # Stub PTX is tiny and targets sm_80; real nvcc output is much larger.
            size="$(wc -c < "$ptx_dir/$f")"
            if [ "$size" -lt 1000 ]; then
              echo "::error::PTX file looks like a stub ($f is ${size} bytes)"
              exit 1
            fi
            if ! grep -q '^\.target sm_120' "$ptx_dir/$f"; then
              echo "::error::PTX file $f does not target sm_120"
              exit 1
            fi
            echo "✓ $f targets sm_120 (${size} bytes)"
          done
          for kernel in ternary_gemv ternary_gemm; do
            if grep -Eq "\\.entry[[:space:]]+${kernel}[[:space:]]*\\(" \
                "$ptx_dir/ternary_gemm_sm_120.ptx"; then
              echo "✓ ternary_gemm PTX: $kernel"
            else
              echo "::error::Missing kernel entry: $kernel"
              exit 1
            fi
          done

      - name: Offline ptxas assemble (sm_120)
        shell: bash
        run: |
          set -euo pipefail
          ptx_dir="$(ls -td target/debug/build/myelin-accelerator-*/out | head -n1)"
          for f in spiking_network_sm_120.ptx vector_similarity_sm_120.ptx \
                   satsolver_sm_120.ptx ternary_gemm_sm_120.ptx; do
            ptxas -arch=sm_120 -o "/tmp/${f%.ptx}.cubin" "$ptx_dir/$f"
            echo "✓ ptxas $f"
          done

      - name: Upload PTX artifacts (cloud)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ptx-sm_120-cloud-13.3.1
          path: target/debug/build/myelin-accelerator-*/out/*.ptx
          retention-days: 14

  # ── CUDA build & validation (SELF-HOSTED GPU RUNNER) ─────────────────────
  # Labels: [self-hosted, linux, x64, gpu, cuda]
  # Local default toolkit: CUDA 13.3.1 via /usr/local/cuda.
  cuda-build:
    name: "CUDA build [self-hosted] (sm_120)"
    runs-on: [self-hosted, linux, x64, gpu, cuda]
    timeout-minutes: 45
    env:
      MYELIN_CUDA_ARCH: sm_120
      # Prefer host default tree (13.3.1 on ShipOfTheseus).
      CUDA_NVCC: /usr/local/cuda/bin/nvcc
      # Do not set MYELIN_PTX_VERSION: build.rs floors sm_12* to ≥ 9.2.
    steps:
      - name: Confirm self-hosted runner
        run: |
          echo "::notice title=Self-hosted runner::Blackwell GPU quality path (not GitHub-hosted)."
          echo "Runner: $(hostname)"
          echo "OS: $(uname -srm)"
          "$CUDA_NVCC" --version || nvcc --version
          nvidia-smi || true

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
          components: clippy

      - name: nvidia-smi (informational)
        continue-on-error: true
        run: nvidia-smi

      - name: nvcc --version (required)
        run: |
          "$CUDA_NVCC" --version
          # Soft-check that we are on 13.3.x locally (warn only).
          if ! "$CUDA_NVCC" --version | grep -q 'release 13\.3'; then
            echo "::warning::Expected CUDA 13.3.x on this host (got other); continuing."
          fi

      - name: Build (debug)
        run: cargo build --locked --features cuda

      - name: Build (release)
        run: cargo build --locked --features cuda --release

      - name: Clippy with CUDA feature
        run: cargo clippy --locked --features cuda -- -D warnings

      - name: Test (debug, CUDA feature, non-ignored)
        run: cargo test --locked --features cuda

      - name: Test GPU goldens (ignored)
        run: cargo test --locked --features cuda -- --ignored --nocapture

      - name: Verify PTX output is non-stub
        shell: bash
        run: |
          set -euo pipefail
          for profile in debug release; do
            ptx_dir="$(ls -td target/$profile/build/myelin-accelerator-*/out 2>/dev/null | head -n1 || true)"
            if [ -z "$ptx_dir" ]; then
              echo "::error::Could not find PTX output directory for profile=$profile"
              exit 1
            fi
            for f in spiking_network_sm_120.ptx vector_similarity_sm_120.ptx \
                     satsolver_sm_120.ptx ternary_gemm_sm_120.ptx; do
              if [ ! -f "$ptx_dir/$f" ]; then
                echo "::error::Missing PTX file ($profile): $f"
                exit 1
              fi
              size="$(wc -c < "$ptx_dir/$f")"
              if [ "$size" -lt 1000 ]; then
                echo "::error::PTX looks like stub ($profile $f is ${size} bytes)"
                exit 1
              fi
              if ! grep -q '^\.target sm_120' "$ptx_dir/$f"; then
                echo "::error::PTX file ($profile) $f does not target sm_120"
                exit 1
              fi
              echo "✓ $profile: $f targets sm_120 (${size} bytes)"
            done
          done

      - name: Validate PTX kernel symbols
        shell: bash
        run: |
          set -euo pipefail
          for profile in debug release; do
            ptx_dir="$(ls -td target/$profile/build/myelin-accelerator-*/out 2>/dev/null | head -n1 || true)"
            echo ""
            echo "Checking kernel entry points in $profile PTX files..."

            for kernel in poisson_encode lif_step lif_step_weighted spike_rate \
                          reset_membrane stdp_update neuro_bias_logits \
                          membrane_dv_dt_reduce_pass1 routing_entropy_reduce_pass1 \
                          latent_reduce_pass2; do
              if grep -Eq "\\.entry[[:space:]]+${kernel}[[:space:]]*\\(" \
                  "$ptx_dir/spiking_network_sm_120.ptx"; then
                echo "✓ $profile spiking_network: $kernel"
              else
                echo "::error::Missing kernel entry: $kernel in $profile spiking_network PTX"
                exit 1
              fi
            done

            for kernel in cosine_similarity_batched cosine_similarity_top_k; do
              if grep -Eq "\\.entry[[:space:]]+${kernel}[[:space:]]*\\(" \
                  "$ptx_dir/vector_similarity_sm_120.ptx"; then
                echo "✓ $profile vector_similarity: $kernel"
              else
                echo "::error::Missing kernel entry: $kernel in $profile vector_similarity PTX"
                exit 1
              fi
            done

            for kernel in satsolver_init satsolver_step satsolver_aux_update \
                          satsolver_check_solution satsolver_extract \
                          satsolver_best_reduce_pass1 satsolver_best_reduce_pass2; do
              if grep -Eq "\\.entry[[:space:]]+${kernel}[[:space:]]*\\(" \
                  "$ptx_dir/satsolver_sm_120.ptx"; then
                echo "✓ $profile satsolver: $kernel"
              else
                echo "::error::Missing kernel entry: $kernel in $profile satsolver PTX"
                exit 1
              fi
            done

            for kernel in ternary_gemv ternary_gemm; do
              if grep -Eq "\\.entry[[:space:]]+${kernel}[[:space:]]*\\(" \
                  "$ptx_dir/ternary_gemm_sm_120.ptx"; then
                echo "✓ $profile ternary_gemm: $kernel"
              else
                echo "::error::Missing kernel entry: $kernel in $profile ternary_gemm PTX"
                exit 1
              fi
            done
          done
          echo ""
          echo "All kernel entry points verified for both debug and release."

      - name: Offline ptxas assemble (sm_120)
        shell: bash
        run: |
          set -euo pipefail
          PTXAS="$(dirname "$CUDA_NVCC")/ptxas"
          ptx_dir="$(ls -td target/debug/build/myelin-accelerator-*/out | head -n1)"
          for f in spiking_network_sm_120.ptx vector_similarity_sm_120.ptx \
                   satsolver_sm_120.ptx ternary_gemm_sm_120.ptx; do
            "$PTXAS" -arch=sm_120 -o "/tmp/${f%.ptx}.cubin" "$ptx_dir/$f"
            echo "✓ ptxas $f"
          done

      - name: Short GPU benchmark (bench,cuda)
        run: |
          cargo run --locked --example benchmark --profile bench \
            --features bench,cuda -- --warmup 2 --iterations 10

      - name: Upload PTX artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ptx-sm_120-self-hosted
          path: |
            target/debug/build/myelin-accelerator-*/out/*.ptx
            target/release/build/myelin-accelerator-*/out/*.ptx
          retention-days: 30

      - name: CUDA build done
        run: echo "CUDA build (debug + release + ignored goldens + short bench, sm_120) passed"
