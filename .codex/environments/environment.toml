# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "myelin-accelerator"

[setup]
script = ""

[setup.linux]
script = '''
set -euo pipefail

cd "${CODEX_WORKTREE_PATH:-$PWD}"

echo "== myelin-accelerator local setup =="

export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
export PATH="$CARGO_HOME/bin:$PATH"

if [ -z "${CUDA_NVCC:-}" ]; then
    if [ -n "${CUDA_HOME:-}" ]; then
        CUDA_NVCC="$CUDA_HOME/bin/nvcc"
    else
        CUDA_NVCC="$(command -v nvcc || true)"
    fi
fi
if [ -z "${CUDA_HOME:-}" ] && [ -n "$CUDA_NVCC" ]; then
    case "$CUDA_NVCC" in
        */bin/nvcc) CUDA_HOME="${CUDA_NVCC%/bin/nvcc}" ;;
    esac
fi
export CUDA_HOME="${CUDA_HOME:-/usr/local/cuda}"
export CUDA_NVCC="${CUDA_NVCC:-$CUDA_HOME/bin/nvcc}"
export MYELIN_CUDA_ARCH="${MYELIN_CUDA_ARCH:-sm_120}"

# ---- Host prerequisites -----------------------------------------------------

for tool in git; do
    if ! command -v "$tool" >/dev/null 2>&1; then
        echo "ERROR: required host tool not found: $tool" >&2
        exit 1
    fi
done

# ---- Rust ------------------------------------------------------------------

if ! command -v rustup >/dev/null 2>&1; then
    echo "ERROR: rustup is required on the local host" >&2
    exit 1
fi

rustup toolchain install 1.98.1 \
    --profile minimal \
    --component rustfmt \
    --component clippy

rustc +1.98.1 --version
cargo +1.98.1 --version

# ---- CUDA / Blackwell sanity ------------------------------------------------

if [ -x "$CUDA_NVCC" ]; then
    "$CUDA_NVCC" --version
else
    echo "CUDA toolkit unavailable; continuing with CPU setup"
fi
if command -v nvidia-smi >/dev/null 2>&1; then
    nvidia-smi -L || echo "NVIDIA driver unavailable; continuing with CPU setup"
fi

# ---- Dependency warm-up + cheap CPU validation -----------------------------

cargo +1.98.1 fetch --locked

cargo +1.98.1 check \
    --locked \
    --no-default-features

cargo +1.98.1 build \
    --locked \
    --example benchmark \
    --features bench

# ---- CMake/CLion worktree configuration ------------------------------------

if command -v cmake >/dev/null 2>&1 && command -v ninja >/dev/null 2>&1; then
    cmake \
        -S . \
        -B cmake-build-debug \
        -G Ninja \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCUDA_NVCC="$CUDA_NVCC" \
        -DCUDA_ARCH="$MYELIN_CUDA_ARCH"
else
    echo "CMake or Ninja unavailable; skipping optional IDE configuration"
fi

echo "== myelin-accelerator local environment ready =="'''

[[actions]]
name = "CPU Gate"
icon = "tool"
command = '''
cargo +1.98.1 fmt --all -- --check &&
cargo +1.98.1 clippy --locked --no-default-features -- -D warnings &&
cargo +1.98.1 test --locked &&
cargo +1.98.1 build --locked --no-default-features &&
cargo +1.98.1 build --locked --example benchmark --features bench'''
platform = "linux"

[[actions]]
name = "CUDA / Blackwell Gate"
icon = "tool"
command = '''
if [ -z "${CUDA_NVCC:-}" ]; then
  if [ -n "${CUDA_HOME:-}" ]; then
    CUDA_NVCC="$CUDA_HOME/bin/nvcc"
  else
    CUDA_NVCC="$(command -v nvcc || true)"
  fi
fi
if [ -z "${CUDA_HOME:-}" ] && [ -n "$CUDA_NVCC" ]; then
  case "$CUDA_NVCC" in
    */bin/nvcc) CUDA_HOME="${CUDA_NVCC%/bin/nvcc}" ;;
  esac
fi
export CUDA_HOME="${CUDA_HOME:-/usr/local/cuda}"
export CUDA_NVCC="${CUDA_NVCC:-$CUDA_HOME/bin/nvcc}"
export MYELIN_CUDA_ARCH="${MYELIN_CUDA_ARCH:-sm_120}"
test -x "$CUDA_NVCC" || { echo "ERROR: nvcc not found at $CUDA_NVCC" >&2; exit 1; }
# find_cuda_helper treats CUDA_LIBRARY_PATH entries as toolkit roots.
export CUDA_LIBRARY_PATH="$CUDA_HOME${CUDA_LIBRARY_PATH:+:$CUDA_LIBRARY_PATH}"

cargo +1.98.1 build --locked --features cuda &&
cargo +1.98.1 clippy --locked --features cuda -- -D warnings &&
cargo +1.98.1 test --locked --features cuda &&
cargo +1.98.1 test --locked --features cuda -- --ignored --nocapture'''
platform = "linux"

[[actions]]
name = "GPU Benchmark"
icon = "tool"
command = '''
if [ -z "${CUDA_NVCC:-}" ]; then
  if [ -n "${CUDA_HOME:-}" ]; then
    CUDA_NVCC="$CUDA_HOME/bin/nvcc"
  else
    CUDA_NVCC="$(command -v nvcc || true)"
  fi
fi
if [ -z "${CUDA_HOME:-}" ] && [ -n "$CUDA_NVCC" ]; then
  case "$CUDA_NVCC" in
    */bin/nvcc) CUDA_HOME="${CUDA_NVCC%/bin/nvcc}" ;;
  esac
fi
export CUDA_HOME="${CUDA_HOME:-/usr/local/cuda}"
export CUDA_NVCC="${CUDA_NVCC:-$CUDA_HOME/bin/nvcc}"
export MYELIN_CUDA_ARCH="${MYELIN_CUDA_ARCH:-sm_120}"
test -x "$CUDA_NVCC" || { echo "ERROR: nvcc not found at $CUDA_NVCC" >&2; exit 1; }
# find_cuda_helper treats CUDA_LIBRARY_PATH entries as toolkit roots.
export CUDA_LIBRARY_PATH="$CUDA_HOME${CUDA_LIBRARY_PATH:+:$CUDA_LIBRARY_PATH}"

cargo +1.98.1 run --locked \
  --example benchmark \
  --profile bench \
  --features bench,cuda \
  -- \
  --warmup 2 \
  --iterations 10'''
platform = "linux"
