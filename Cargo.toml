[package]
name = "myelin-accelerator"
version = "0.2.0"
edition = "2024"
description = "Rust/CUDA acceleration primitives for spiking neural networks and neuromorphic workloads"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Limen-Neural/myelin-accelerator"
keywords = ["cuda", "snn", "neuromorphic", "gpu", "spiking-network"]
categories = ["hardware-support", "artificial-intelligence", "simulation"]
# Anchor every pattern at the crate root. An unanchored `README.md` also
# matches ignored agent/runner dependencies with that basename on this host.
# The CUDA build reads cu/; package verification reads SNN fixtures and scripts.
# Benchmark regression fixtures and their fixture-only test stay repository-only.
include = [
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/REVIEW.md", "/LICENSE-*", "/build.rs",
    "/src/**", "/cu/**", "/examples/**", "/tests/**", "/scripts/**", "/docs/**",
    "!/tests/bench_repro.rs", "!/tests/fixtures/bench/**",
]

[lib]
name = "myelin_accelerator"
path = "src/lib.rs"

[features]
default = []
# nvtx ranges under the cuda feature (kernel load + ternary launch wrappers).
cuda = ["dep:cust", "dep:nvtx"]
# Example harness flag. Kept so existing `--features bench` commands stay
# valid; serde is always on so CPU CI can validate manifest schema.
bench = []

[dependencies]
cust      = { version = "0.3.2", optional = true }
tracing   = "0.1"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
nvtx      = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1"
sha2 = "=0.11.0"

[[example]]
name = "benchmark"
required-features = ["bench"]
