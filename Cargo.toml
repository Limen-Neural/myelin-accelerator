[package]
name = "myelin-accelerator"
version = "0.2.0"
edition = "2024"
description = "CUDA spiking-network kernels + safe Rust FFI wrappers (Tier 1)"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Limen-Neural/myelin-accelerator"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "src/**/*.rs",
    "cu/**/*.cu",
    "cu/**/*.cuh",
    "examples/benchmark.rs",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "docs/ARCHITECTURE.md",
    "docs/BENCHMARKS.md",
    "docs/TERNARY.md",
]

[lib]
name = "myelin_accelerator"
path = "src/lib.rs"

[features]
default = []
# nvtx ranges under the cuda feature (kernel load + ternary launch wrappers).
cuda = ["dep:cust", "dep:nvtx"]
# Example harness flag. Kept so existing `--features bench` commands stay
# valid; serde is always on so CPU CI can validate manifest schema.
bench = []

[dependencies]
cust      = { version = "0.3.2", optional = true }
anyhow    = { version = "1", features = ["backtrace"] }
tracing   = "0.1"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
nvtx      = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1"

[[example]]
name = "benchmark"
required-features = ["bench"]
