# Qodana for Rust — primary static analysis for this crate.
# Host packing, FFI, and public API live in Rust; CUDA is feature-gated.
#
# Requires QODANA_TOKEN (JetBrains cloud) for full PR reporting.
# Linter short name pairs with JetBrains/qodana-action (latest release).
# Local:  qodana scan --linter qodana-rust

version: "1.0"
linter: qodana-rust

profile:
  name: qodana.recommended

exclude:
  - name: All
    paths:
      - target
      - cmake-build-debug
      - actions-runner
      - .swarm-worktrees
      - .agents
      - agent
